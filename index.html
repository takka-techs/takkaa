<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Takka POS & ERP</title>
    <script>
      try {
        const desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(globalThis, 'fetch');
        if (desc && desc.get && !desc.set) {
          let _f = desc.get();
          Object.defineProperty(window, 'fetch', {
            get: function() { return _f; },
            set: function(val) { _f = val; },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
